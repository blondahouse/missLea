    litellm_params:
      model: openai/lab-model
      api_base: http://127.0.0.1:19100/v1
      api_key: sk-lab-synthetic-only
  - model_name: lab-backup
    litellm_params:
      model: openai/lab-model
      api_base: http://127.0.0.1:19101/v1
