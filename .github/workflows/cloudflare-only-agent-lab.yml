name: Cloudflare-only Agent Lab — offline build
on:
  pull_request:
    paths:
      - 'labs/cloudflare_agent/**'
      - 'labs/agent_core/**'
      - 'labs/living_memory/**'
      - '.github/workflows/cloudflare-only-agent-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: labs/cloudflare_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run check:core
      - run: node --test ../living_memory/test/*.test.mjs
      - run: python -m unittest discover -s ../living_memory/test -p 'test_*.py' -v
      - run: npm run build:check
      - run: npm run build:core
