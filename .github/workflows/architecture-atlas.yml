name: Miss Lea — Architecture Atlas
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/architecture-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: architecture-atlas-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source modules and relationship integrity
        run: |
          node --check site/app.mjs
          node --check site/data.mjs
          node site/check.mjs
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
