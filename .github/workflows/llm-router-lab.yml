name: LLM Router Lab

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s labs -t . -p 'test_*.py' -v
  fair-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run every gateway on the same runner against local synthetic mocks
        run: bash labs/llm_router/scripts/run_fair_comparison.sh
      - name: Upload evidence, including incomplete or failed comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-fair-comparison
          path: |
            reports/*.json
            reports/*.txt
          if-no-files-found: warn
  portkey-security-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect pinned Portkey with localhost-only synthetic canary
        run: bash labs/llm_router/scripts/run_portkey_security_trial.sh
      - name: Publish the security verdict (not a production approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portkey-security-diagnostic
          path: |
            reports/portkey-security.json
            reports/portkey-security-image.txt
          if-no-files-found: warn
