name: Operator Control Plane — synthetic test
on:
  pull_request:
    paths:
      - "labs/operator_control/**"
      - ".github/workflows/operator-control-plane.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m labs.operator_control.cli --list-accounts
      - run: python -m unittest discover -s labs/operator_control -p 'test_*.py' -v
