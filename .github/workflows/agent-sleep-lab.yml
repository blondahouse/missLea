name: Agent Sleep Lab — offline synthetic contract
on:
  pull_request:
    paths:
      - 'labs/agent_sleep/**'
      - '.github/workflows/agent-sleep-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test labs/agent_sleep/tests.mjs
